# usd-asset-gate configuration (https://github.com/Preponderous-Software/usd-asset-gate).
# Applies to the committed golden stage and to the stages CI generates;
# see .github/workflows/usd-asset-gate.yml.
version: 1
fail_on: warning

rules:
  # roam-usd writes one tile = one metre, Z up.
  stage-metadata:
    metersPerUnit: 1
    upAxis: "Z"
  file-size:
    max_bytes: { default: 10MB }
